[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clonoloom"
version = "0.8.0"
description = "Reviewed local automation of ClonoLoom repertoire analyses with exact JSON numbers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robert McDermott" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.urls]
Homepage = "https://github.com/robert-mcdermott/clonoloom"
Documentation = "https://github.com/robert-mcdermott/clonoloom/blob/main/docs/PYTHON.md"

[tool.setuptools.packages.find]
where = ["src"]
